<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <h1>🎓 Student Management System</h1>

        <p>Welcome Admin</p>

        <div class="card-container">

            <div class="card">
                <h2>Student Registration</h2>
                <p>Add new student details.</p>

                <a href="student.html">
                    <button>Open</button>
                </a>

            </div>

            <div class="card">
                <h2>Student List</h2>
                <p>View, Search, Edit and Delete students.</p>

                <a href="student-list.html">
                    <button>Open</button>
                </a>

            </div>

            <div class="card">
                <h2>Logout</h2>
                <p>Exit the application.</p>

                <button onclick="logout()">Logout</button>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
